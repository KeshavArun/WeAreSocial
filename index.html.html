<style>
  :root{
    --bg:#11141a; --surface:#1a1f28; --surface-2:#232a37; --surface-3:#2b3341;
    --line:#323b4a; --text:#e8ebf2; --text-dim:#8b93a7; --text-faint:#5b6478;
    --accent:#4c8eda; --accent-dim:#325e8f;
    --verified:#43b581; --verified-dim:#1f3a2c;
    --estimated:#e0a63e; --estimated-dim:#453317;
    --danger:#e2574c;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #root{min-height:100vh;padding:28px;}
  .shell{max-width:1280px;margin:0 auto;}

  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:var(--mono);font-size:13px;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 7px;border-radius:3px;letter-spacing:0.06em;}
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:0.01em;}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .clock{font-family:var(--mono);font-size:11px;color:var(--text-faint);}

  .grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start;}
  @media (max-width:920px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .panel-head .label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--text-faint);text-transform:uppercase;}
  .panel-body{padding:16px;}

  textarea{width:100%;min-height:260px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--text);
    font-family:var(--mono);font-size:12.5px;line-height:1.55;padding:12px;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--accent);}
  textarea::placeholder{color:var(--text-faint);}

  .sample-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--line);
    padding:5px 9px;border-radius:3px;cursor:pointer;transition:border-color .15s;}
  .chip:hover{border-color:var(--accent);color:var(--text);}

  .dropzone{border:1px dashed var(--line);border-radius:4px;padding:16px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;background:var(--surface-2);margin-bottom:12px;}
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent);background:rgba(76,142,218,.06);}
  .dropzone .dz-title{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text);}
  .dropzone .dz-sub{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .dropzone input[type=file]{display:none;}
  .file-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;
    background:var(--surface-3);border:1px solid var(--line);border-radius:3px;padding:6px 10px;margin-bottom:12px;color:var(--text-dim);}
  .file-badge .name{color:var(--text);}
  .file-badge .x{cursor:pointer;color:var(--text-faint);}
  .file-badge .x:hover{color:var(--danger);}
  .divider{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-family:var(--mono);font-size:10px;
    color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
  .divider .line{flex:1;height:1px;background:var(--line);}

  .run-btn{width:100%;margin-top:14px;background:var(--accent);color:#0b1420;border:none;border-radius:4px;padding:11px 14px;
    font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s;}
  .run-btn:hover{background:#5f9aec;}
  .run-btn:disabled{background:var(--surface-3);color:var(--text-faint);cursor:not-allowed;}

  .log{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:14px;line-height:1.9;min-height:20px;}
  .log .line{display:flex;gap:8px;}
  .log .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);margin-top:6px;flex:none;}
  .log .dot.ok{background:var(--verified);}
  .log .dot.spin{background:var(--accent);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .empty{color:var(--text-faint);font-family:var(--mono);font-size:12px;padding:40px 20px;text-align:center;}

  .template-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--accent);
    background:rgba(76,142,218,.1);border:1px solid var(--accent-dim);padding:4px 9px;border-radius:3px;}
  .reasoning{color:var(--text-dim);font-size:12.5px;line-height:1.6;margin-top:8px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text);}
  td.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  tr.total td{font-weight:700;border-top:1px solid var(--line);border-bottom:none;}
  tr.total{background:var(--surface-2);}
  .channel-tag{font-family:var(--mono);font-weight:700;font-size:12px;}

  .val{display:inline-flex;align-items:center;gap:6px;}
  .flag{width:6px;height:6px;border-radius:50%;flex:none;}
  .flag.verified{background:var(--verified);box-shadow:0 0 0 2px var(--verified-dim);}
  .flag.estimated{background:var(--estimated);box-shadow:0 0 0 2px var(--estimated-dim);}
  .tip{position:relative;cursor:help;border-bottom:1px dashed var(--text-faint);}
  .tip .bubble{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);width:220px;
    background:#080a0d;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--sans);
    font-size:11px;line-height:1.5;color:var(--text-dim);z-index:5;white-space:normal;text-align:left;}
  .tip:hover .bubble{display:block;}

  .legend{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
  .legend .item{display:flex;align-items:center;gap:6px;}

  .toolbar{display:flex;gap:8px;}
  .btn-ghost{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--text-dim);background:var(--surface-2);
    border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--text);}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed;}

  .meta-bar{display:flex;gap:22px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11.5px;flex-wrap:wrap;}
  .meta-bar .m{display:flex;flex-direction:column;gap:2px;}
  .meta-bar .m .k{color:var(--text-faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;}
  .meta-bar .m .v{color:var(--text);}

  .err{color:var(--danger);font-family:var(--mono);font-size:12px;padding:14px 16px;background:rgba(226,87,76,.08);
    border:1px solid rgba(226,87,76,.3);border-radius:4px;margin-top:12px;}
</style>

<div id="root"></div>

function b64ToArrayBuffer(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function el(tag, attrs={}, ...children){
  attrs = attrs || {};
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='disabled') e.disabled = !!v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{ if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}

const state = { briefText:'', fileName:null, extraction:null, research:null, rows:null, template:null, running:false, error:null, log:[] };

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  const shell = el('div',{class:'shell'});

  shell.append(
    el('div',{class:'topbar'},
      el('div',{class:'brand'},
        el('span',{class:'mark'},'BUYSHEET'),
        el('div',null,
          el('h1',null,'Draft Media Plan Generator'),
          el('div',{class:'sub'},'brief → template match → research → buy sheet')
        )
      ),
      el('div',{class:'clock'},'PROTOTYPE — v0.1')
    )
  );

  const grid = el('div',{class:'grid'});

  // LEFT PANEL — intake
  const left = el('div',{class:'panel'});
  left.append(el('div',{class:'panel-head'}, el('span',{class:'label'},'01 — Intake')));
  const leftBody = el('div',{class:'panel-body'});

  if(state.fileName){
    const badge = el('div',{class:'file-badge'},
      el('span',null,'📄'), el('span',{class:'name'}, state.fileName),
      el('span',{class:'x', onclick:()=>{ state.fileName=null; state.briefText=''; render(); }}, '✕ remove'));
    leftBody.append(badge);
  } else {
    const dz = el('div',{class:'dropzone', id:'dropzone'},
      el('div',{class:'dz-title'},'⭱ Drop a brief here, or click to upload'),
      el('div',{class:'dz-sub'},'.docx · .pdf · .txt'),
      el('input',{type:'file', id:'file-input', accept:'.docx,.pdf,.txt,.md'})
    );
    dz.addEventListener('click', ()=> document.getElementById('file-input').click());
    dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('dragover'));
    dz.addEventListener('drop', (e)=>{
      e.preventDefault(); dz.classList.remove('dragover');
      if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    leftBody.append(dz);
    setTimeout(()=>{
      const fi = document.getElementById('file-input');
      if(fi) fi.addEventListener('change', (e)=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
    }, 0);

    const divider = el('div',{class:'divider'}, el('span',{class:'line'}), '— or paste text —', el('span',{class:'line'}));
    leftBody.append(divider);
  }

  const ta = el('textarea',{id:'brief-input', placeholder:'Paste the client brief text here (from the brief doc / email)...',
    oninput:(e)=>{
      state.briefText = e.target.value;

function fmt(n,d){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); }

async function handleFile(file){
  state.log = [];
  state.error = null;
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  pushLog('Reading '+file.name+'…','spin');
  try{
    let text;
    if(ext === 'docx'){
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: buf});
      text = result.value;
      if(result.messages && result.messages.length){
        pushLog(result.messages.length+' formatting note(s) from docx conversion (ignorable)','');
      }
    } else if(ext === 'pdf'){
      if(!window.pdfjsLib) throw new Error('PDF reader failed to load');
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      let pages = [];
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        pages.push(content.items.map(it=>it.str).join(' '));
      }
      text = pages.join('\n\n');
    } else if(ext === 'txt' || ext === 'md'){
      text = await file.text();
    } else if(ext === 'doc'){
      throw new Error('.doc (legacy Word format) isn\'t supported — please re-save as .docx, or paste the text instead');
    } else {
      throw new Error('Unsupported file type .'+ext+' — use .docx, .pdf, or .txt');
    }
    text = (text||'').trim();
    if(!text){
      throw new Error('No extractable text found in this file (it may be a scanned/image-only document)');
    }
    pushLog(`Extracted ${text.length.toLocaleString()} characters — summarizing…`, 'spin');
    let summary;
    try{
      summary = await summarizeBrief(text);
    } catch(sumErr){
      pushLog('Summarization failed — using the raw extracted text instead', '');
      summary = text;
    }
    state.briefText = summary;
    state.fileName = file.name;
    pushLog(`Ready — summarized ${file.name}`, 'ok');
    render();
    const btn = document.getElementById('run-btn');
    if(btn) btn.disabled = state.running || !state.briefText.trim();
  } catch(err){
    state.error = 'Could not read '+file.name+': '+err.message;
    pushLog('Failed to read file', '');
    render();
  }
}

async function summarizeBrief(rawText){
  const sys = `You are a media planning assistant. You'll be given raw text extracted from a client brief document (a docx or PDF) - it may have messy spacing or table cells run together since it came from automated extraction.
Rewrite it as a clean, well-organized brief summary that preserves every concrete fact: budget figures, currency, dates, platforms, target audience details, company names, content volume, objectives, and any other specifics. Do not omit any number, name, or date. Do not invent or add anything that isn't in the source text. Use clear labeled sections (Brand, Budget, Dates, Market, Target Audience, Objective, Channels, Content, etc.) where the source supports them. This summary will be used directly for campaign planning, so completeness matters more than brevity.
Respond with ONLY the cleaned-up brief text - no preamble, no meta-commentary.`;
  const r = await callClaude([{role:"user", content: rawText}], sys, null, 2000);
  const text = (r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = text.trim();
  if(!cleaned) throw new Error('Empty summary returned');
  return cleaned;
}

async function callClaude(messages, system, tools, maxTokens=2000){
  const body = { model: "claude-sonnet-4-6", max_tokens: maxTokens, system, messages };
  if(tools) body.tools = tools;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  if(!resp.ok){
    let detail = '';
    try{ const errBody = await resp.json(); detail = errBody?.error?.message ? ' — '+errBody.error.message : ''; } catch(_){}
    throw new Error("API error "+resp.status+detail);
  }
  return resp.json();
}

function extractJson(text){
  const cleaned = text.replace(/```json|```/g,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if(start === -1 || end === -1 || end <= start){
    throw new Error('No JSON object found in the model response (it may have been cut off)');
  }
  return JSON.parse(cleaned.slice(start, end+1));
}

    }
    pushLog('Reading brief…','spin');
    const templateList = Object.entries(TEMPLATES).map(([k,v])=>`- ${k}: ${v.matchHint}`).join('\n');

Available templates:
${templateList}
Respond with ONLY a JSON object, no preamble, no markdown fences, matching exactly this shape:
{

IMPORTANT on duration_label: briefs usually give a START DATE and END DATE rather than stating a duration directly.
If that's the case, calculate the span yourself and write it as e.g. "6 Days (20-25 Jul 2026)" or "1 Month (01-31 Aug 2026)".

    let extraction;

{"findings":[{"platform":string,"metric":string,"value":number,"unit":string,"source_name":string,"source_url":string}], "confidence":"high"|"low"|"none"}
CRITICAL UNIT RULE: for "engagement rate" and "conversion rate" metrics, "value" MUST be a decimal fraction between 0 and 1 (e.g. 2.5% is written as 0.025, NOT as 2.5). For CPM/CPC metrics, "value" is a plain USD number (e.g. 35.00). Set "unit" to "fraction" for rates and "usd" for costs.

      const r2 = await callClaude([{role:"user", content:"Find current benchmarks now."}], researchSys,

function findBenchmark(research, platform, metricKeyword){
  if(!research || !research.findings) return null;
  const f = research.findings.find(x =>
    (x.platform||'').toLowerCase().includes(platform.toLowerCase()) &&
    (x.metric||'').toLowerCase().includes(metricKeyword.toLowerCase()));
  return f || null;
}

// A legitimate engagement/conversion rate is always a fraction under 1 (e.g. 0.025 for 2.5%).
// If a live search result comes back as "2.5" meaning "2.5%", trust the units, not the raw number -
// normalize it here regardless of what the model claimed its "unit" field was.
function normalizeRateBenchmark(bench){
  if(!bench) return bench;
  let v = bench.value;
  if(Math.abs(v) > 1) v = v/100;
  if(v <= 0 || v > 0.5) return null; // still nonsensical for an engagement/conversion rate - don't trust it
  return Object.assign({}, bench, { value: v });
}

function buildRows(ex, templateKey, research){
  const tmpl = TEMPLATES[templateKey];
  const platforms = (ex.platforms && ex.platforms.length) ? ex.platforms : ['LinkedIn','Instagram'];
  // normalize names to LinkedIn/Instagram where possible
  const norm = platforms.map(p=>{
    const pl = p.toLowerCase();
    if(pl.includes('linked')) return 'LinkedIn';
    if(pl.includes('insta')) return 'Instagram';
    return p;
  });
  let split = tmpl.defaultSplit;
  if(ex.split_stated && ex.split_ratio){
    const s = {};
    Object.entries(ex.split_ratio).forEach(([k,v])=>{ s[k] = v>1 ? v/100 : v; });
    split = s;
  }
  const budgetTotal = Number(ex.budget_total_aed) || 0;
  const rows = [];
  norm.forEach(ch=>{
    const shareRaw = split[ch];
    const share = (shareRaw!=null) ? shareRaw : (1/norm.length);
    const budgetAed = Math.round(budgetTotal * share);
    const budgetUsd = budgetAed/3.685;
    if(tmpl.buyingModel === 'CPM'){
      const bench = findBenchmark(research, ch, 'CPM');
      const cpm = bench ? bench.value : tmpl.cpmFallback[ch] || 20;
      const erBench = normalizeRateBenchmark(findBenchmark(research, ch, 'engagement'));
      const er = erBench ? erBench.value : (tmpl.erFallback[ch] || 0.02);
      const impressions = cpm>0 ? (budgetUsd/cpm*1000) : 0;
      const freq = tmpl.freq[ch] || 3;
      const reach = impressions/freq;
      const engagement = er*impressions;
      rows.push({
        channel: ch, objective: ex.objective || 'Engagement', adType: tmpl.adType[ch] || '—',
        audience: buildAudienceText(ex, ch), content: ex.content_volume_text || '—', market: ex.market || '—',
        duration: ex.duration_label || '—', budgetAed, budgetUsd,
        cpm, cpmSourced: !!bench, cpmSource: bench ? bench.source_name : null,
        impressions, freq, reach, engagement, erSourced: !!erBench, erSource: erBench ? erBench.source_name : null
      });
    } else {
      const bench = findBenchmark(research, ch, 'CPC');
      const cpc = bench ? bench.value : tmpl.cpcFallback[ch] || 3;
      const cvrBench = normalizeRateBenchmark(findBenchmark(research, ch, 'conversion'));
      const cvr = cvrBench ? cvrBench.value : (tmpl.cvrFallback[ch] || 0.05);
      const clicks = cpc>0 ? (budgetUsd/cpc) : 0;
      const leads = clicks*cvr;
      rows.push({
        channel: ch, objective: ex.objective || 'Lead Generation', adType: tmpl.adType[ch] || '—',
        audience: buildAudienceText(ex, ch), content: ex.content_volume_text || '—', market: ex.market || '—',
        duration: ex.duration_label || '—', budgetAed, budgetUsd,
        cpc, cpcSourced: !!bench, cpcSource: bench ? bench.source_name : null,
        clicks, cvr, leads, cvrSourced: !!cvrBench, cvrSource: cvrBench ? cvrBench.source_name : null
      });
    }
  });
  return rows;
}

function buildAudienceText(ex, channel){
  let t = ex.target_audience_text || '—';
  if(channel === 'LinkedIn' && ex.companies_to_target && ex.companies_to_target.length){
    t += '\n\nCompany Targeting: ' + ex.companies_to_target.join(', ');
  } else if(channel !== 'LinkedIn' && ex.companies_to_target && ex.companies_to_target.length){
    t += '\n\nNote: Company-level targeting not available on this platform - interest/behavior proxy used instead.';
  }
  return t;
}

function downloadWorkbook(wb, filename){
  return wb.xlsx.writeBuffer().then(buf=>{
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

// Loads the actual agency template file and only writes values into it -
// every color, border, merge, and formula is the original file's own, never reconstructed.
async function exportFromRealTemplate(){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(b64ToArrayBuffer(TEMPLATE_XLSX_B64));
  wb.calcProperties.fullCalcOnLoad = true; // force Excel to recompute on open, don't rely solely on cached results
  const ws = wb.getWorksheet('Media Plan');

  const origFormulas = {
    J: ws.getCell('J10').value.formula,
    M: ws.getCell('M10').value.formula,
    O: ws.getCell('O10').value.formula,
    P: ws.getCell('P10').value.formula
  };
  const cols = ['B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];
  const colStyle = {};
  cols.forEach(c=>{
    const cell = ws.getCell(`${c}10`);
    colStyle[c] = { font: cell.font, fill: cell.fill, border: cell.border, alignment: cell.alignment, numFmt: cell.numFmt };
  });
  const adaptFormula = (f, newRow)=> f.replace(/([A-Z]+)10\b/g, (m,p1)=> p1+newRow);

  let r = 10;
  const firstDataRow = r;
  state.rows.forEach((row, idx)=>{
    if(idx > 0){
      ws.spliceRows(r, 0, []);
      ws.getRow(r).height = ws.getRow(10).height;
      cols.forEach(c=>{
        const cell = ws.getCell(`${c}${r}`);
        cell.font = colStyle[c].font; cell.fill = colStyle[c].fill; cell.border = colStyle[c].border;
        cell.alignment = colStyle[c].alignment; cell.numFmt = colStyle[c].numFmt;
      });
    }
    ws.getCell(`B${r}`).value = row.channel;
    ws.getCell(`C${r}`).value = row.objective;
    ws.getCell(`D${r}`).value = row.adType;
    ws.getCell(`E${r}`).value = row.audience;
    ws.getCell(`F${r}`).value = row.duration;
    ws.getCell(`G${r}`).value = row.content;
    ws.getCell(`H${r}`).value = row.market;
    ws.getCell(`I${r}`).value = row.budgetAed;
    // formula + cached result (the exact number we already computed in JS), so it displays
    // correctly even in viewers that don't auto-recalculate formulas on open
    ws.getCell(`J${r}`).value = { formula: adaptFormula(origFormulas.J, r), result: Math.round(row.budgetUsd*100)/100 };
    ws.getCell(`K${r}`).value = 'CPM';
    const cpmCell = ws.getCell(`L${r}`);
    cpmCell.value = Number(row.cpm.toFixed(2));
    if(!row.cpmSourced) cpmCell.note = { texts:[{text:'ESTIMATED - not sourced this session. Confirm with LinkedIn/Meta Ads Manager forecasting before client use.'}] };
    ws.getCell(`M${r}`).value = { formula: adaptFormula(origFormulas.M, r), result: Math.round(row.impressions) };
    ws.getCell(`N${r}`).value = row.freq;
    ws.getCell(`O${r}`).value = { formula: adaptFormula(origFormulas.O, r), result: Math.round(row.reach) };
    ws.getCell(`P${r}`).value = { formula: adaptFormula(origFormulas.P, r), result: Math.round(row.engagement) };
    const erCell = ws.getCell(`Q${r}`);
    erCell.value = Number((row.engagement/row.impressions).toFixed(4));
    if(!row.erSourced) erCell.note = { texts:[{text:'ESTIMATED - not sourced this session. Treat as a planning benchmark only.'}] };
    r++;
  });
  const lastDataRow = r - 1;

  // TOTAL row - the template itself has no example of this, so it's the one row we add rather than copy
  const sumOf = (field)=> state.rows.reduce((s,row)=>s+row[field],0);
  ws.spliceRows(r, 0, []);
  cols.forEach(c=>{ ws.getCell(`${c}${r}`).border = colStyle[c].border; });
  ws.getCell(`B${r}`).value = 'TOTAL';
  ws.getCell(`B${r}`).font = { name:'Arial', bold:true };
  const totCell = (col, formula, result)=>{
    const cell = ws.getCell(`${col}${r}`);
    cell.value = { formula, result };
    cell.numFmt = colStyle[col].numFmt;
    cell.font = { name:'Arial', bold:true };
  };
  totCell('I', `SUM(I${firstDataRow}:I${lastDataRow})`, sumOf('budgetAed'));
  totCell('J', `SUM(J${firstDataRow}:J${lastDataRow})`, Math.round(sumOf('budgetUsd')*100)/100);
  totCell('M', `SUM(M${firstDataRow}:M${lastDataRow})`, Math.round(sumOf('impressions')));
  totCell('O', `SUM(O${firstDataRow}:O${lastDataRow})`, Math.round(sumOf('reach')));
  totCell('P', `SUM(P${firstDataRow}:P${lastDataRow})`, Math.round(sumOf('engagement')));

  await downloadWorkbook(wb, (state.extraction.brand||'draft').replace(/\s+/g,'_')+'_Draft_Media_Plan.xlsx');
}

// No real template exists for lead-gen yet, so this one is still built programmatically.
const THICK = {style:'thick'};
const THIN = {style:'thin'};
const borderAll = (s)=>({top:s,bottom:s,left:s,right:s});
function colLetter(c){ let s='',n=c+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }

async function exportFromScratchStyled(){
  const headers = ['Channel','Objective','Ad Type','Audience Targeting','Duration','Content','Market',
       'Budget AED','Budget USD','Buying Model','CPC','Clicks','Conversion Rate','Leads'];
  const lastColIdx = 1 + headers.length - 1;
  const bannerColIdx = 10;

  const wb = new ExcelJS.Workbook();
  wb.calcProperties.fullCalcOnLoad = true;
  const ws = wb.addWorksheet('Media Plan');

  ws.mergeCells('B8:C8');
  ws.mergeCells(`D8:${colLetter(9)}8`);
  ws.mergeCells(`${colLetter(bannerColIdx)}8:${colLetter(lastColIdx)}8`);
  const bannerStyle = {
    font:{name:'Arial', size:11, bold:true},
    fill:{type:'pattern', pattern:'solid', fgColor:{argb:'FFD9D9D9'}},
    alignment:{vertical:'middle', horizontal:'left'},
    border:borderAll(THICK)
  };
  ['B8','D8', colLetter(bannerColIdx)+'8'].forEach(addr=>{ Object.assign(ws.getCell(addr), bannerStyle); });
  ws.getCell(colLetter(bannerColIdx)+'8').value = 'ESTIMATED RESULTS *';

  headers.forEach((h,i)=>{
    const cell = ws.getCell(9, 2+i);
    cell.value = h;
    cell.font = {name:'Arial', size:11, bold:true, color:{argb:'FFFFFFFF'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFF0000'}};
    cell.alignment = {vertical:'middle', horizontal:'left', wrapText:true};
    cell.border = borderAll(THICK);
  });

  const applyDataStyle = (cell, wrap)=>{
    cell.font = {name:'Arial', size:11};
    cell.alignment = {vertical:'middle', horizontal:'left', wrapText: !!wrap};
    cell.border = borderAll(THIN);
  };

  let r = 10;
  const firstDataRow = r, lastDataRow = r + state.rows.length - 1;
  state.rows.forEach(row=>{
    const set = (col, val, opts={})=>{
      const cell = ws.getCell(`${col}${r}`);
      cell.value = val;
      applyDataStyle(cell, opts.wrap);
      if(opts.fmt) cell.numFmt = opts.fmt;
      if(opts.note) cell.note = { texts:[{text:opts.note}] };
      return cell;
    };
    set('B', row.channel); set('C', row.objective); set('D', row.adType, {wrap:true});
    set('E', row.audience, {wrap:true}); set('F', row.duration); set('G', row.content, {wrap:true});
    set('H', row.market); set('I', row.budgetAed, {fmt:'"AED "#,##0'});
    set('J', {formula:`I${r}/3.685`, result: Math.round(row.budgetUsd*100)/100}, {fmt:'[$$]#,##0'});
    set('K', 'CPC');
    set('L', Number(row.cpc.toFixed(2)), {fmt:'[$$]#,##0.00',
      note: row.cpcSourced ? null : 'ESTIMATED - not sourced this session. Confirm with Ads Manager forecasting before client use.'});
    set('M', {formula:`J${r}/L${r}`, result: Math.round(row.clicks)}, {fmt:'#,##0'});
    set('N', Number(row.cvr), {fmt:'0.0%',
      note: row.cvrSourced ? null : 'ESTIMATED - not sourced this session. Treat as a planning benchmark only.'});
    set('O', {formula:`M${r}*N${r}`, result: Math.round(row.leads)}, {fmt:'#,##0'});
    ws.getRow(r).height = 95;
    r++;
  });

  const totRow = r;
  const tCell = (col, val, fmt)=>{
    const cell = ws.getCell(`${col}${totRow}`);
    cell.value = val;
    cell.font = {name:'Arial', size:11, bold:true};
    cell.border = borderAll(THIN);
    if(fmt) cell.numFmt = fmt;
    return cell;
  };
  tCell('B','TOTAL');
  const sumOf = (field)=> state.rows.reduce((s,row)=>s+row[field],0);
  tCell('I', {formula:`SUM(I${firstDataRow}:I${lastDataRow})`, result: sumOf('budgetAed')}, '"AED "#,##0');
  tCell('J', {formula:`SUM(J${firstDataRow}:J${lastDataRow})`, result: Math.round(sumOf('budgetUsd')*100)/100}, '[$$]#,##0');
  tCell('M', {formula:`SUM(M${firstDataRow}:M${lastDataRow})`, result: Math.round(sumOf('clicks'))}, '#,##0');
  tCell('O', {formula:`SUM(O${firstDataRow}:O${lastDataRow})`, result: Math.round(sumOf('leads'))}, '#,##0');

  const discRow = totRow + 2;
  const discCell = ws.getCell(`D${discRow}`);
  discCell.value = '* All projected results listed in this media plan are estimates only and campaign results may vary. '+
    'Cells with a note attached are unsourced planning benchmarks - verify with live platform forecasting before sending to a client.';
  discCell.font = {name:'Arial', size:10, italic:true, color:{argb:'FFFF0000'}};
  discCell.alignment = {wrapText:true};

  const widths = [4.6,12,12,16,45,20,22,10,12,12,12,10,14,14,14,14,15];
  widths.slice(0,lastColIdx+1).forEach((w,i)=>{ ws.getColumn(i+1).width = w; });
  ws.getColumn(1).width = 3;

  await downloadWorkbook(wb, (state.extraction.brand||'draft').replace(/\s+/g,'_')+'_Draft_Media_Plan.xlsx');
}

render();
</script>
